<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Euclides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=5.0.1"/>
  <link rel="icon" type="image/svg+xml" href="icon.svg"/>
  <link rel="manifest" href="manifest.json"/>
</head>
<body>
  <!-- ── Top bar ─────────────────────────────────────────────────── -->
  <header id="topbar">
    <button id="topbar-brand" onclick="Router.navigate('')" aria-label="Ir para o início">
      <img src="icon.svg" class="logo-mark" alt="Euclides"/>
      <span class="logo-text">Euclides</span>
    </button>
    <nav id="topbar-nav">
      <a class="topbar-tab" href="formulas.html">Fórmulas</a>
      <a class="topbar-tab" href="guia-professor.html">Guia do Professor</a>
      <a class="topbar-tab" href="plano-aula.html">Plano de Aula</a>
      <button class="topbar-tab" onclick="TopPanel.open('sobre')">Sobre</button>
      <button class="topbar-tab" onclick="TopPanel.open('ajuda')">Ajuda</button>
      <button class="topbar-tab" onclick="TopPanel.open('ecossistema')">Ecossistema</button>
      <button class="topbar-tab topbar-menu-button" onclick="TopPanel.open('mais')">Menu</button>
    </nav>
  </header>

  <!-- ── App shell ─────────────────────────────────────────────────── -->
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="btn-sidebar-close" onclick="Sidebar.close()" aria-label="Fechar menu">&times;</button>
      </div>
      <div id="progress-bar-wrap"></div>
      <nav id="topic-nav"></nav>
      <div id="sidebar-footer">
        <button id="btn-stats" onclick="Router.navigate('stats')">Estatísticas</button>
        <button id="btn-exam" onclick="Router.navigate('exam')">Prova</button>
        <button id="btn-review" onclick="Router.navigate('review')">Revisão</button>
        <button id="btn-teacher" onclick="Router.navigate('teacher')">Modo Professor</button>
      </div>
    </aside>
    <main id="main">
      <div id="mobile-bar">
        <button id="btn-hamburger" onclick="Sidebar.open()" aria-label="Abrir menu">&#9776;</button>
        <span class="mobile-title">Euclides</span>
      </div>
      <div id="view"></div>
    </main>
    <div id="sidebar-overlay" onclick="Sidebar.close()"></div>
  </div>

  <nav id="mobile-nav" aria-label="Navegação principal">
    <button data-route="home" onclick="Router.navigate('')"><span aria-hidden="true">⌂</span><span>Início</span></button>
    <button data-route="catalog" onclick="Router.navigate('catalog')"><span aria-hidden="true">⌕</span><span>Explorar</span></button>
    <button data-route="practice" onclick="Router.navigate('practice')"><span aria-hidden="true">△</span><span>Praticar</span></button>
    <button data-route="progress" onclick="Router.navigate('progress')"><span aria-hidden="true">↗</span><span>Progresso</span></button>
    <button data-route="more" onclick="TopPanel.open('mais')"><span aria-hidden="true">•••</span><span>Mais</span></button>
  </nav>

  <!-- ── Top panel modals ──────────────────────────────────────────── -->
  <div id="tpanel-overlay" onclick="TopPanel.close()"></div>
  <div id="tpanel" role="dialog" aria-modal="true">
    <div id="tpanel-header">
      <span id="tpanel-title"></span>
      <button id="tpanel-close" onclick="TopPanel.close()" aria-label="Fechar">&times;</button>
    </div>
    <div id="tpanel-body"></div>
  </div>
  <script src="js/progress.js?v=5.0.1"></script>
  <script src="js/ui.js?v=5.0.1"></script>
  <script src="js/renderer.js?v=5.0.1"></script>
  <script src="math/rng.js?v=5.0.1"></script>
  <script>window.MathGenerators = {};</script>
  <script src="js/generator-loader.js?v=5.0.1"></script>
  <script src="math/fallback.js?v=5.0.1"></script>
  <script src="js/task-engine.js?v=5.0.1"></script>
  <script src="js/wasm-loader.js?v=5.0.1"></script>
  <script src="js/teacher.js?v=5.0.1"></script>
  <script src="js/router.js?v=5.0.1"></script>

  <script src="js/stats.js?v=5.0.1"></script>
  <script src="js/sidebar.js?v=5.0.1"></script>
  <script src="js/anim.js?v=5.0.1"></script>
  <script src="js/review.js?v=5.0.1"></script>
  <script src="js/completion.js?v=5.0.1"></script>
  <script src="js/exam.js?v=5.0.1"></script>
  <script src="js/main.js?v=5.0.1"></script>
  <script>
  /* ── TopPanel — modal controller ──────────────────────────────── */
  var TopPanel = (function () {
    var _current = null;
    var _trigger = null;

    var _content = {
      sobre: {
        title: 'Sobre o Euclides',
        html:
          '<p>Euclides é uma plataforma de ensino de matemática desenvolvida para cobrir ' +
          'do Ensino Fundamental I ao Ensino Superior, com foco em clareza conceitual e prática adaptativa.</p>' +
          '<h3>Cobertura</h3>' +
          '<p>84 tópicos em 4 níveis: Fundamental I, Fundamental II, Ensino Médio e Ensino Superior. ' +
          'O Ensino Superior inclui Cálculo I/II/III, Álgebra Linear, EDO, EDP, Transformadas, ' +
          'Cálculo Numérico, Grafos e Variável Complexa.</p>' +
          '<h3>Tecnologia</h3>' +
          '<p>Aplicação browser-only em HTML, CSS e JavaScript puro. Sem frameworks, sem servidor. ' +
          'Funciona offline após o primeiro acesso (PWA).</p>' +
          '<h3>Filosofia</h3>' +
          '<p>Sem infantilização. Cada tópico apresenta a matemática real — canvas com planos cartesianos, ' +
          'curvas e retratos de fase — seguido de prática com dificuldade adaptativa.</p>'
      },
      ajuda: {
        title: 'Ajuda',
        html:
          '<h3>Como usar</h3>' +
          '<div class="help-step"><div class="help-num">1</div><div>Escolha um tópico no menu lateral. Os grupos seguem a progressão curricular.</div></div>' +
          '<div class="help-step"><div class="help-num">2</div><div>Leia o <strong style="color:var(--text)">Conceito</strong> — teoria com visualização em canvas.</div></div>' +
          '<div class="help-step"><div class="help-num">3</div><div>Acompanhe o <strong style="color:var(--text)">Exemplo</strong> — resolução passo a passo.</div></div>' +
          '<div class="help-step"><div class="help-num">4</div><div>Pratique — exercícios com dificuldade ajustada pelo seu desempenho.</div></div>' +
          '<h3>Funcionalidades</h3>' +
          '<p><strong style="color:var(--text)">Prova</strong> — 20 questões cronometradas (30 min) de tópicos variados.</p>' +
          '<p><strong style="color:var(--text)">Revisão</strong> — seleção automática dos tópicos com menor acurácia.</p>' +
          '<p><strong style="color:var(--text)">Estatísticas</strong> — acurácia global, por nível e por tópico.</p>' +
          '<p><strong style="color:var(--text)">Modo Professor</strong> — criação de exercícios personalizados e folha imprimível com gabarito.</p>' +
          '<h3>Dificuldade adaptativa</h3>' +
          '<p>A dificuldade (1–5) sobe após 4 acertos consecutivos e cai após 4 erros nos últimos 5 exercícios.</p>'
      },
      ecossistema: {
        title: 'Ecossistema',
        html:
          '<p>Plataformas educacionais do mesmo ecossistema.</p>' +
          '<a class="eco-link" href="https://luddevergard3n.github.io/quintiliano/" target="_blank" rel="noopener">' +
            '<div><div class="eco-link-name">Quintiliano</div><div class="eco-link-desc">Português e literatura</div></div>' +
          '</a>' +
          '<a class="eco-link" href="https://luddevergard3n.github.io/johnson-english/" target="_blank" rel="noopener">' +
            '<div><div class="eco-link-name">Johnson English</div><div class="eco-link-desc">L\u00edngua inglesa</div></div>' +
          '</a>' +
          '<a class="eco-link" href="https://luddevergard3n.github.io/humboldt/" target="_blank" rel="noopener">' +
            '<div><div class="eco-link-name">Humboldt</div><div class="eco-link-desc">Geografia</div></div>' +
          '</a>' +
          '<a class="eco-link" href="https://luddevergard3n.github.io/Herodoto/" target="_blank" rel="noopener">' +
            '<div><div class="eco-link-name">Her\u00f3doto</div><div class="eco-link-desc">Hist\u00f3ria</div></div>' +
          '</a>' +
          '<a class="eco-link" href="https://luddevergard3n.github.io/lavoisier/" target="_blank" rel="noopener">' +
            '<div><div class="eco-link-name">Lavoisier</div><div class="eco-link-desc">Qu\u00edmica</div></div>' +
          '</a>' +
          '<a class="eco-link" href="https://luddevergard3n.github.io/archimedes/" target="_blank" rel="noopener">' +
            '<div><div class="eco-link-name">Archimedes</div><div class="eco-link-desc">F\u00edsica</div></div>' +
          '</a>'
      },
      mais: {
        title: 'Mais opções',
        html:
          '<nav class="more-menu">' +
            '<a href="formulas.html">Referência de fórmulas</a>' +
            '<a href="guia-professor.html">Guia do Professor</a>' +
            '<a href="plano-aula.html">Plano de Aula</a>' +
            '<button onclick="TopPanel.open(\'sobre\')">Sobre o Euclides</button>' +
            '<button onclick="TopPanel.open(\'ajuda\')">Ajuda</button>' +
            '<button onclick="TopPanel.open(\'ecossistema\')">Ecossistema</button>' +
          '</nav>'
      }
    };

    function open(key) {
      if (_current === key) { close(); return; }
      _current = key;
      var c = _content[key];
      if (!c) return;
      _trigger = document.activeElement;
      document.getElementById('tpanel-title').textContent = c.title;
      document.getElementById('tpanel-body').innerHTML = c.html;
      document.getElementById('tpanel').classList.add('open');
      document.getElementById('tpanel-overlay').classList.add('open');
      document.querySelectorAll('.topbar-tab').forEach(function (b) {
        b.classList.toggle('active', b.textContent.toLowerCase().replace('\u00e9','e') === key);
      });
      document.getElementById('tpanel-close').focus();
    }

    function close() {
      _current = null;
      document.getElementById('tpanel').classList.remove('open');
      document.getElementById('tpanel-overlay').classList.remove('open');
      document.querySelectorAll('.topbar-tab').forEach(function (b) {
        b.classList.remove('active');
      });
      if (_trigger && typeof _trigger.focus === 'function') _trigger.focus();
      _trigger = null;
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
      if (e.key === 'Tab' && _current) {
        var panel = document.getElementById('tpanel');
        var focusable = panel.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled])');
        if (!focusable.length) return;
        var first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    return { open: open, close: close };
  })();
  </script>
</body>
</html>
